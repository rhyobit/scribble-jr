<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="980px" height="237px" viewBox="0 0 980 237"><text x="490" y="42" text-anchor="middle" fill="#2a9fd6" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="bold">Scribble Jr — a Windows app for young coders</text><text x="490" y="82" text-anchor="middle" fill="#2a9fd6" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="bold">Adapted by James and Peter Rafferty</text><text x="490" y="126" text-anchor="middle" fill="#2a9fd6" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="normal">Based on ScratchJr by the DevTech Research Group at Tufts University,</text><text x="490" y="158" text-anchor="middle" fill="#2a9fd6" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="normal">the Lifelong Kindergarten Group at the MIT Media Lab and Playful Invention Company.</text><text x="490" y="204" text-anchor="middle" fill="#2a9fd6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="normal">Not affiliated with or endorsed by MIT or Tufts.</text></svg>
