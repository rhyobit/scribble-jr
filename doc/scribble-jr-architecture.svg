<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1010" viewBox="0 0 840 1010" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
  <title>Scribble Jr architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="840" height="1010" fill="#fff"/>

  <text x="467" y="30" font-size="21" font-weight="bold">Scribble Jr Architecture</text>

  <!-- column dividers -->
  <g stroke="#000" stroke-dasharray="2 4">
    <line x1="108" y1="58" x2="108" y2="1000"/>
    <line x1="347" y1="58" x2="347" y2="1000"/>
    <line x1="587" y1="58" x2="587" y2="1000"/>
    <line x1="827" y1="58" x2="827" y2="1000"/>
  </g>

  <!-- column headings -->
  <g font-weight="bold">
    <text x="227" y="76">Android App</text>
    <text x="467" y="76">iOS App</text>
    <text x="707" y="76">Windows Desktop</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="227" y="93">upstream ScratchJr, not built here</text>
    <text x="467" y="93">upstream ScratchJr, not built here</text>
    <text x="707" y="93" fill="#a35a00" font-weight="bold">Scribble Jr: present (was future)</text>
  </g>

  <!-- row labels -->
  <g>
    <text x="54" y="205">Browser</text>
    <text x="54" y="365">Client Tier</text>
    <text x="54" y="625">Back End</text>
    <text x="54" y="690">Local Storage</text>
    <text x="54" y="885">Server</text>
  </g>

  <!-- browser row -->
  <g stroke="#000" stroke-width="1.5">
    <rect x="127" y="110" width="200" height="190" fill="#fff"/>
    <rect x="367" y="110" width="200" height="190" fill="#fff"/>
    <rect x="607" y="110" width="200" height="60" fill="#fff"/>
    <rect x="607" y="182" width="200" height="118" fill="#ffd59a"/>
  </g>
  <text x="227" y="200">Android WebView</text>
  <text x="227" y="217">(WebKit-based)</text>
  <text x="467" y="209">iOS WebKit</text>
  <text x="707" y="136">Microsoft Edge WebView2</text>
  <text x="707" y="153">(Tauri window)</text>
  <text x="707" y="208" font-weight="bold">Desktop bridge</text>
  <text x="707" y="225">tablet-desktop.js</text>
  <text x="707" y="249" font-size="12">sound · microphone</text>
  <text x="707" y="265" font-size="12">camera · picture import</text>
  <text x="707" y="281" font-size="12">.sjr files · keyboard</text>

  <!-- client tier -->
  <rect x="127" y="320" width="680" height="80" fill="#add8e6" stroke="#000" stroke-width="1.5"/>
  <text x="467" y="347">ScratchJr Common Client</text>
  <text x="467" y="364">HTML5 / JavaScript</text>
  <text x="467" y="381">(shared; Scribble Jr adds a paint-editor zoom fix and new art)</text>

  <!-- client to back end -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="127" y1="460" x2="182" y2="460"/>
    <line x1="272" y1="460" x2="427" y2="460"/>
    <line x1="507" y1="460" x2="637" y2="460"/>
    <line x1="777" y1="460" x2="807" y2="460"/>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="227" y1="418" x2="227" y2="437"/>
    <line x1="227" y1="480" x2="227" y2="499"/>
    <line x1="467" y1="418" x2="467" y2="437"/>
    <line x1="467" y1="480" x2="467" y2="499"/>
    <line x1="707" y1="418" x2="707" y2="437"/>
    <line x1="707" y1="480" x2="707" y2="499"/>
  </g>
  <g font-weight="bold">
    <text x="227" y="456">WebView</text>
    <text x="227" y="472">Native</text>
    <text x="467" y="456">Local</text>
    <text x="467" y="472">HTTP</text>
    <text x="707" y="456">Tauri IPC</text>
    <text x="707" y="472">(invoke)</text>
  </g>

  <!-- back end -->
  <g stroke="#000" stroke-width="1.5">
    <rect x="127" y="518" width="200" height="200" fill="#add8e6"/>
    <rect x="367" y="518" width="200" height="200" fill="#add8e6"/>
    <rect x="607" y="518" width="200" height="200" fill="#ffd59a"/>
  </g>
  <text x="227" y="598">ScratchJr</text>
  <text x="227" y="615">Android Native Code</text>
  <text x="227" y="632">(Android Port)</text>
  <text x="467" y="598">ScratchJr</text>
  <text x="467" y="615">Embedded Web Server</text>
  <text x="467" y="632">(iOS Port)</text>
  <text x="707" y="548" font-weight="bold">Windows shell</text>
  <text x="707" y="565">Rust, Tauri v2 (src-tauri)</text>
  <text x="707" y="589" font-size="12">asset files · .sjr open/save</text>
  <text x="707" y="605" font-size="12">locked-down webview</text>
  <text x="707" y="621" font-size="12">no network access</text>

  <!-- sqlite cylinders -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <path d="M187 664 v26 a40 9 0 0 0 80 0 v-26"/>
    <ellipse cx="227" cy="664" rx="40" ry="9"/>
    <path d="M427 664 v26 a40 9 0 0 0 80 0 v-26"/>
    <ellipse cx="467" cy="664" rx="40" ry="9"/>
    <path d="M667 664 v26 a40 9 0 0 0 80 0 v-26"/>
    <ellipse cx="707" cy="664" rx="40" ry="9"/>
  </g>
  <text x="227" y="689">sqlite</text>
  <text x="467" y="689">sqlite</text>
  <text x="707" y="689">sqlite</text>

  <!-- back end to server -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="127" y1="779" x2="197" y2="779"/>
    <line x1="257" y1="779" x2="437" y2="779"/>
    <line x1="497" y1="779" x2="567" y2="779"/>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="227" y1="738" x2="227" y2="757"/>
    <line x1="227" y1="800" x2="227" y2="819"/>
    <line x1="467" y1="738" x2="467" y2="757"/>
    <line x1="467" y1="800" x2="467" y2="819"/>
  </g>
  <g font-weight="bold">
    <text x="227" y="784">HTTP</text>
    <text x="467" y="784">HTTP</text>
  </g>

  <!-- server -->
  <rect x="127" y="838" width="440" height="80" fill="#90ee90" stroke="#000" stroke-width="1.5"/>
  <text x="347" y="866">Scratch Jr. HTTP Server</text>
  <text x="347" y="883">Tutorial and Help Pages</text>
  <text x="347" y="900">(MIT Server)</text>
  <rect x="607" y="838" width="200" height="80" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="707" y="866" font-weight="bold">No server</text>
  <text x="707" y="883">Runs offline; the app</text>
  <text x="707" y="900">cannot reach the web</text>

  <!-- legend -->
  <g text-anchor="start">
    <text x="118" y="972">Legend:</text>
    <rect x="178" y="961" width="18" height="16" fill="#add8e6" stroke="#000"/>
    <text x="203" y="974">Client-side</text>
    <rect x="292" y="961" width="18" height="16" fill="#90ee90" stroke="#000"/>
    <text x="317" y="974">Server-side</text>
    <rect x="409" y="961" width="18" height="16" fill="#ffd59a" stroke="#000"/>
    <text x="434" y="974">Added by Scribble Jr</text>
  </g>
</svg>
